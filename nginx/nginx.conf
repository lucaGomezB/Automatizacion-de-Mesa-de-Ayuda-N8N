# nginx reverse proxy — TLS termination for the mesa_local Docker Compose stack
#
# All external HTTP traffic enters through this proxy on ports 80/443.
# Internal container-to-container communication stays on plain HTTP over
# the Docker bridge network (backend:8000, frontend:3000, n8n:5678).
#
# Certificates are volume-mounted from ./openssl at /etc/nginx/certs/.

# ── Hardening (c-62, OQ-6) ─────────────────────────────────────────────────────
# Ocultar la version de nginx en el header Server y en las paginas de error.
server_tokens off;

# Limites de tasa por IP de origen. Zonas a nivel http (este archivo se incluye
# dentro de http via conf.d). Umbral conservador: el login es de bajo volumen y
# los webhooks de Twilio pueden venir en rafaga; ambos devuelven 429 al exceso.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=60r/m;

# ── Catch-all: reject unknown Host / SNI ───────────────────────────────────────
# This MUST stay the default_server for 80/443. Without it the localhost/mesa.local
# block becomes the default and serves the frontend app for ANY hostname that
# happens to resolve to this machine. That is exactly what happened when the ISP
# DNS blocked openrouter.ai by returning a loopback address (127.9.9.9): the
# browser reached the local nginx instead. Returning 444 closes the connection
# with no response, so unknown Host/SNI never gets the app.
server {
    listen       80  default_server;
    listen       443 ssl default_server;
    http2        on;

    server_name  _;

    ssl_certificate      /etc/nginx/certs/mesa.crt;
    ssl_certificate_key  /etc/nginx/certs/mesa.key;
    ssl_protocols        TLSv1.2 TLSv1.3;

    return 444;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────

server {
    listen       80;
    # localhost/mesa.local = acceso local. Los hosts ngrok son el tunel publico
    # que usa Twilio (docs/runbook-verificacion-telefonia-c52.md); ngrok reenvia
    # Host=tameness-trilogy-unrefined.ngrok-free.dev (--host-header). Todo lo que
    # NO figure aca cae al catch-all default_server (return 444).
    server_name  localhost mesa.local
                 tameness-trilogy-unrefined.ngrok-free.dev
                 *.ngrok-free.dev *.ngrok-free.app *.ngrok.io;

    # Redirect ALL HTTP traffic to HTTPS, preserving path and query string
    return 301 https://$host$request_uri;
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────

server {
    listen       443 ssl;
    http2        on;
    # Misma whitelist de hosts que el bloque HTTP de arriba; mantener en sincronia.
    server_name  localhost mesa.local
                 tameness-trilogy-unrefined.ngrok-free.dev
                 *.ngrok-free.dev *.ngrok-free.app *.ngrok.io;

    # ── TLS Configuration ────────────────────────────────────────────────────
    ssl_certificate      /etc/nginx/certs/mesa.crt;
    ssl_certificate_key  /etc/nginx/certs/mesa.key;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY"   always;
    # c-62 (OQ-6): headers adicionales. Content-Security-Policy se DIFIERE
    # (debe validarse contra la SPA por separado).
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=(), payment=()" always;

    # El exceso de tasa responde 429 (no el 503 por defecto de nginx).
    limit_req_status 429;

    # ── General Proxy Settings ───────────────────────────────────────────────
    client_max_body_size 10M;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ── Limite de tasa: login (c-62, OQ-6; ajustado en c-63a, D7) ─────────────
    # Prefijo mas especifico que /api/, por lo que gana en el matching.
    # c-63a: la capacidad de rafaga (burst=10) queda POR ENCIMA del umbral de
    # bloqueo por cuenta (5 por defecto), de modo que el lockout sea observable
    # antes de que nginx responda 429 a un cliente que acumula fallos.
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=10 nodelay;

        proxy_pass http://backend:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Limite de tasa: webhook de voz de Twilio (c-62, OQ-6) ────────────────
    location = /api/v1/cost-guard/twilio/voice {
        limit_req zone=webhook_limit burst=20 nodelay;

        proxy_pass http://backend:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Limite de tasa: webhooks de telefonia (c-62, OQ-6) ───────────────────
    location /api/v1/telefonia/ {
        limit_req zone=webhook_limit burst=20 nodelay;

        proxy_pass http://backend:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Backend API (FastAPI) ────────────────────────────────────────────────
    # All /api/ requests are forwarded to the backend service over internal HTTP.
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Frontend SPA (React + Vite dev server) ───────────────────────────────
    # All other paths are served by the Vite dev server with HMR support.
    location / {
        proxy_pass http://frontend:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket support for Vite Hot Module Replacement
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
