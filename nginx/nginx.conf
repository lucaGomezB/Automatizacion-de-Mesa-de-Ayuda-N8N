# nginx reverse proxy — TLS termination for the mesa_local Docker Compose stack
#
# All external HTTP traffic enters through this proxy on ports 80/443.
# Internal container-to-container communication stays on plain HTTP over
# the Docker bridge network (backend:8000, frontend:3000, n8n:5678).
#
# Certificates are volume-mounted from ./openssl at /etc/nginx/certs/.

# ── Catch-all: reject unknown Host / SNI ───────────────────────────────────────
# This MUST stay the default_server for 80/443. Without it the localhost/mesa.local
# block becomes the default and serves the frontend app for ANY hostname that
# happens to resolve to this machine. That is exactly what happened when the ISP
# DNS blocked openrouter.ai by returning a loopback address (127.9.9.9): the
# browser reached the local nginx instead. Returning 444 closes the connection
# with no response, so unknown Host/SNI never gets the app.
server {
    listen       80  default_server;
    listen       443 ssl default_server;
    http2        on;

    server_name  _;

    ssl_certificate      /etc/nginx/certs/mesa.crt;
    ssl_certificate_key  /etc/nginx/certs/mesa.key;
    ssl_protocols        TLSv1.2 TLSv1.3;

    return 444;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────

server {
    listen       80;
    # localhost/mesa.local = acceso local. Los hosts ngrok son el tunel publico
    # que usa Twilio (docs/runbook-verificacion-telefonia-c52.md); ngrok reenvia
    # Host=tameness-trilogy-unrefined.ngrok-free.dev (--host-header). Todo lo que
    # NO figure aca cae al catch-all default_server (return 444).
    server_name  localhost mesa.local
                 tameness-trilogy-unrefined.ngrok-free.dev
                 *.ngrok-free.dev *.ngrok-free.app *.ngrok.io;

    # Redirect ALL HTTP traffic to HTTPS, preserving path and query string
    return 301 https://$host$request_uri;
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────

server {
    listen       443 ssl;
    http2        on;
    # Misma whitelist de hosts que el bloque HTTP de arriba; mantener en sincronia.
    server_name  localhost mesa.local
                 tameness-trilogy-unrefined.ngrok-free.dev
                 *.ngrok-free.dev *.ngrok-free.app *.ngrok.io;

    # ── TLS Configuration ────────────────────────────────────────────────────
    ssl_certificate      /etc/nginx/certs/mesa.crt;
    ssl_certificate_key  /etc/nginx/certs/mesa.key;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY"   always;

    # ── General Proxy Settings ───────────────────────────────────────────────
    client_max_body_size 10M;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ── Backend API (FastAPI) ────────────────────────────────────────────────
    # All /api/ requests are forwarded to the backend service over internal HTTP.
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ── Frontend SPA (React + Vite dev server) ───────────────────────────────
    # All other paths are served by the Vite dev server with HMR support.
    location / {
        proxy_pass http://frontend:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket support for Vite Hot Module Replacement
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
