# docker-compose.yml — Entorno de desarrollo: Nginx + Frontend + Backend + N8N + PostgreSQL + Redis
#
# Puertos publicados en el host:
#   80, 443   → Nginx reverse proxy (TLS termination, HTTP→HTTPS redirect)
#   5433      → PostgreSQL
#   6379      → Redis
#   5678      → N8N (acceso directo — admin UI y webhooks)
#
# Uso:
#   docker compose up -d           # Levantar todos los servicios
#   docker compose ps              # Verificar estado y salud
#   docker compose logs -f backend # Seguir logs del backend
#   docker compose down            # Detener y remover contenedores (los volumes persisten)
#   docker compose down -v         # Detener + borrar volumes (base de datos limpia)
#
# Prerequisitos:
#   1. Generar certificados TLS:  bash openssl/generate-certs.sh  (Linux/Mac)
#                                 .\openssl\generate-certs.ps1    (Windows PowerShell)
#   2. Crear el archivo .env en App/Backend/ copiando .env.example y
#      completando los valores reales.
#
# Nota: este compose crea la red mesa_local_default y sus propios volumes
# (prefijo mesa_local_*), sin colisionar con los contenedores de C-01
# (gestion_incidentes-*) que pueden existir detenidos en el sistema.

# Nombre de proyecto fijo: sin esto, `docker compose up` usa el nombre del
# directorio como proyecto y crea un stack DUPLICADO que colisiona los puertos
# publicados (8000/5678/6379/5433) con el stack ya corriendo.
name: mesa_local

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      # Credenciales locales parametrizadas (ver .env.example de la raiz).
      # Los valores por defecto son SOLO para desarrollo local y ya no son
      # adivinables; sobreescribir en el .env raiz (gitignorado) para cualquier
      # otro uso. Si un volumen postgres_data existente fue inicializado con la
      # password vieja, definir POSTGRES_PASSWORD con ese valor en el .env raiz
      # o recrear el volumen con `docker compose down -v`.
      POSTGRES_USER: ${POSTGRES_USER:-mesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mesa_de_ayuda}
    ports:
      - "5433:5432"           # Puerto 5433 en el host para evitar colisión con C-01 (5432)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mesa} -d ${POSTGRES_DB:-mesa_de_ayuda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend FastAPI ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./App/Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./App/Backend/.env
    environment:
      # Sobreescribir DATABASE_URL para apuntar al postgres de este compose
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mesa}:${POSTGRES_PASSWORD:-mesa_local_dev}@postgres:5432/${POSTGRES_DB:-mesa_de_ayuda}
      # Sobreescribir la URL del webhook de N8N para apuntar al servicio n8n de este compose.
      # C-33 (D7): ruta dedicada de notificacion, distinta del webhook de alta
      # `incidente-web`, que no crea incidentes.
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/notificacion-clasificacion
      # El prompt se monta desde la raíz del repo (ver volumes abajo)
      GEMINI_PROMPT_PATH: /app/docs/prompt_gemini.txt
    # Backend is accessed exclusively through the nginx reverse proxy on port 443.
    # The internal port 8000 is NOT published to the host.
    volumes:
      # Inyectar el prompt (que está en la raíz del repo, no en App/Backend/)
      - ./docs/prompt_gemini.txt:/app/docs/prompt_gemini.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── N8N ─────────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.11.2   # Pin a la version validada localmente; evita cambios silenciosos de 'latest' (C-34)
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Autenticacion basica de N8N
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-n8n_local_dev}
      # Variable de entorno disponible en los nodos del workflow como $env.BACKEND_URL
      BACKEND_URL: http://backend:8000
      # Redis para la memoria del AI Agent
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      # Configuracion de N8N
      N8N_PROTOCOL: https
      N8N_HOST: 0.0.0.0
      N8N_PORT: "5678"
      WEBHOOK_URL: https://localhost:5678/
      # En Windows/Docker Desktop los permisos de archivos difieren — ignorar warnings
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      # Deshabilitar telemetria
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Retencion automatica de datos de ejecucion (30 dias = 720 horas)
      # Configurado segun tesis §5.3 para cumplir con politica de retencion de 30 dias
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      # Tope de ejecucion del servicio (C-36): cota por defecto de 300 s y techo
      # configurable de 600 s, para que una ejecucion colgada (por ejemplo,
      # esperando un recurso pago) no permanezca activa indefinidamente.
      EXECUTIONS_TIMEOUT: "300"
      EXECUTIONS_TIMEOUT_MAX: "600"
    volumes:
      - n8n_data:/home/node/.n8n
      # Montar el workflow JSON para poder importarlo via CLI dentro del contenedor
      - ./n8n/workflow.json:/data/Automatizacion_Mesa_de_Ayuda.json:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend React (producción con nginx) ──────────────────────────────────
  frontend:
    build:
      context: ./App/Frontend
      dockerfile: Dockerfile
      args:
        # Vite hornea VITE_API_BASE_URL en tiempo de build: debe llegar como
        # build arg, no como `environment` de runtime (que nginx ignora porque
        # sirve un bundle estatico ya compilado). El valor es el ORIGEN sin
        # `/api/v1`; api.ts agrega ese prefijo una sola vez.
        VITE_API_BASE_URL: https://localhost
    restart: unless-stopped
# Frontend is accessed exclusively through the nginx reverse proxy on port 443.
    # The internal port 3000 is NOT published to the host.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────────
  # TLS termination at the edge of the Docker network.
  # All external HTTP/HTTPS traffic enters here. Internal service-to-service
  # communication (backend <-> n8n, backend <-> postgres, n8n <-> redis)
  # remains on plain HTTP over the Docker bridge network.
  #
  # Certificates are volume-mounted from ./openssl (generated by the helper
  # scripts: openssl/generate-certs.sh or openssl/generate-certs.ps1).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./openssl:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  postgres_data:   # Volume dedicado para este compose (prefijo mesa_local_ asignado por Docker)
  n8n_data:
