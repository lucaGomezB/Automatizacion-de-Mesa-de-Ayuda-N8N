# ci.yml — GitHub Actions CI workflow (C-09, C-19, C-64, c-166)
# Cinco jobs paralelos: backend-tests, frontend-tests, secret-scan,
# security-scan y corpus-ingest-tests.
# Triggers: push a main y pull_request.
# C-19: PostgreSQL service container + integration test step.
# secret-scan: gitleaks sobre el historial git + escaneo de la memoria de Engram.
# security-scan: auditoria de dependencias (pip-audit/npm audit) + SAST (bandit).
# Sin secretos: toda la suite corre 100% offline (Gemini/N8N mockeados).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Backend — ruff lint + pytest (SQLite unit + PostgreSQL integration) + evaluation suite
  # -----------------------------------------------------------------------
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest

    # C-19: PostgreSQL 15.5 service container for integration tests.
    # Maps port 5432 inside the job; TEST_PG_URL points at it.
    services:
      postgres:
        image: postgres:15.5-alpine
        env:
          POSTGRES_USER: mesa
          POSTGRES_PASSWORD: mesa_ci_local
          POSTGRES_DB: mesa_de_ayuda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Settings (pydantic-settings) exige 4 campos sin default. Localmente
    # salen del .env (gitignorado); en CI se inyectan dummies validos. NO son
    # secretos: los tests mockean Gemini/N8N, el engine de la DATABASE_URL nunca
    # conecta (conftest inyecta SQLite in-memory) y las claves son de relleno.
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_dummy
      GEMINI_API_KEY: ci-dummy-key
      PSEUDONYMIZATION_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= # gitleaks:allow (dummy: base64url de 32 bytes '0')
      JWT_SECRET_KEY: ci-dummy-jwt-secret-key-for-testing-only # gitleaks:allow (dummy)
      COST_GUARD_CALLER_HMAC_KEY: ci-dummy-cost-guard-caller-hmac-key # gitleaks:allow (dummy)
      DIRECTORY_BLIND_INDEX_KEY: ci-dummy-directory-blind-index-key # gitleaks:allow (dummy, c-153)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/Backend/requirements.txt

      - name: Install backend dependencies
        working-directory: App/Backend
        run: pip install -r requirements.txt

      - name: Install ruff (pinned, not in requirements.txt)
        run: pip install ruff==0.8.4

      - name: Lint backend with ruff
        working-directory: App/Backend
        run: ruff check .

      - name: Run backend unit tests (SQLite) with coverage
        working-directory: App/Backend
        run: |
          pytest -m "not integration" \
            --cov=app.routes \
            --cov=app.services \
            --cov=app.repositories \
            --cov-report=term-missing

      # C-19: PostgreSQL integration tests against the service container.
      # TEST_PG_URL overrides the default (localhost:5433) to use the
      # GitHub Actions service container on localhost:5432.
      - name: Run PostgreSQL integration tests
        working-directory: App/Backend
        env:
          TEST_PG_URL: postgresql+asyncpg://mesa:mesa_ci_local@localhost:5432/mesa_de_ayuda
        run: pytest -m integration -v

      # Verification de sincronia del OpenAPI estatico (C-10, D3):
      # regenera el esquema en memoria y lo compara contra docs/openapi.json.
      # Falla si el archivo commiteado no refleja el estado actual de la app.
      - name: Verify OpenAPI spec is in sync
        working-directory: App/Backend
        run: pytest tests/test_openapi_sync.py -v

      # C-41: cost readiness preflight. It is not part of App/Backend
      # requirements, so its own requirements file is installed first. The
      # suite covers guards present/absent; the CLI runs over the real
      # n8n/workflow.json and docker-compose.yml.
      - name: Install preflight dependencies
        run: pip install -r scripts/preflight/requirements.txt

      - name: Run cost preflight tests
        run: python -m pytest scripts/preflight -q

      - name: Run cost readiness preflight
        run: python scripts/preflight/cost_readiness.py

      # c-58: estatico, sin red ni clave; verifica modelo pineado + reintento acotado.
      - name: Run Gemini readiness preflight
        run: python scripts/preflight/gemini_readiness.py

      # c-145 (H): barrera ejecutable de DOC-005. Compara CLAUDE.md y
      # openspec/config.yaml contra settings.py, constants.py, requirements.txt
      # y docker-compose.yml; falla nombrando cada valor divergente.
      - name: Run docs stack sync preflight
        run: python scripts/preflight/docs_stack_sync.py

      # Evaluation suite — self-contained (fixture JSON + FakeClassifier)
      # Chapter 7 thesis evidence; must not rot.
      - name: Install evaluation dependencies
        working-directory: evaluation
        run: pip install -r requirements.txt

      - name: Run evaluation tests
        working-directory: evaluation
        run: pytest

  # -----------------------------------------------------------------------
  # Job 2: App/Frontend — ESLint + Vitest con cobertura
  # -----------------------------------------------------------------------
  frontend-tests:
    name: App/Frontend tests (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: App/Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: App/Frontend
        run: npm ci

      - name: Lint frontend with ESLint
        working-directory: App/Frontend
        run: npm run lint

      - name: Run frontend tests with coverage
        working-directory: App/Frontend
        run: npm run test:coverage

  # -----------------------------------------------------------------------
  # Job 3: secret-scan — historial de git con gitleaks + memoria de Engram
  # -----------------------------------------------------------------------
  # Cubre dos frentes que el escaneo nativo de GitHub no ve:
  #   1. El historial COMPLETO de git con gitleaks (ruleset por defecto mas la
  #      allowlist minima de .gitleaks.toml). Requiere fetch-depth: 0.
  #   2. Los chunks .jsonl.gz de la memoria de Engram (.engram/), que GitHub no
  #      inspecciona, via scripts/security/scan_engram_secrets.py (gzip-aware).
  # No se usa gitleaks/gitleaks-action para evitar dependencias de licencia:
  # se descarga el .tar.gz del release fijado y se mueve a /usr/local/bin.
  secret-scan:
    name: Secret scan (gitleaks + Engram)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historial completo para gitleaks)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version fijada: la misma verificada localmente (v8.30.1). El checksum
      # se valida para que el propio job de seguridad no confie ciegamente en
      # el binario descargado.
      - name: Install gitleaks (pinned v8.30.1)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets with gitleaks
        run: gitleaks git . --redact --config .gitleaks.toml --no-banner --exit-code 1

      - name: Scan Engram memory (.engram) for secrets
        run: python3 scripts/security/scan_engram_secrets.py .engram

  # -----------------------------------------------------------------------
  # Job 4: security-scan — auditoria de dependencias + SAST, en paralelo (C-64)
  # -----------------------------------------------------------------------
  # Cubre los tres escaneos requeridos por el delta spec de ci-pipeline.
  # Parametros centralizados (rutas + umbral de severidad):
  #   - objetivo SAST ............ App/Backend/app  (excluye tests/ y alembic/)
  #   - objetivo deps backend .... App/Backend/requirements.txt
  #   - objetivo deps frontend ... App/Frontend
  #   - umbral de bloqueo (SAST) . -lll   (severidad ALTA unicamente)
  #   - umbral (deps frontend) ... --audit-level=high (modo reporte)
  # Politica de bloqueo por escaneo:
  #   1. SAST backend       -> bandit: bloquea solo severidad ALTA (-lll).
  #   2. auditoria deps BE  -> pip-audit: bloquea ante toda vulnerabilidad
  #                            con correccion disponible; excepciones
  #                            explicitas por ID, solo para hallazgos SIN
  #                            correccion publicada upstream.
  #   3. auditoria deps FE  -> npm audit: NO bloqueante (reporte) en esta
  #                            iteracion (--audit-level=high + `|| true`).
  # Design D1: job dedicado en paralelo, con las herramientas FIJADAS e
  # instaladas en el entorno de ESTE job. No ejecuta
  # `pip install -r requirements.txt` ni `npm ci`, de modo que NO altera el
  # arbol de dependencias instalado por los jobs de pruebas.
  # Sin secretos: lee solo los archivos de dependencias y el codigo versionados.
  security-scan:
    name: Security scan (deps + SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Herramientas de escaneo FIJADAS (mismo patron que ruff==0.8.4 y el
      # gitleaks fijado): corridas reproducibles. Se instalan en el entorno de
      # este job; no tocan el requirements.txt del backend ni el
      # package-lock.json del frontend.
      - name: Install pinned scanners (pip-audit, bandit)
        run: python -m pip install pip-audit==2.7.3 bandit==1.7.10

      # Escaneo 1/3 - SAST backend. Politica de bloqueo (D2): bandit falla ante
      # hallazgos de severidad ALTA (`-lll`); media y baja se reportan sin
      # bloquear, para no frenar el pipeline por deuda preexistente.
      - name: Backend SAST (bandit, blocks HIGH only)
        run: bandit -r App/Backend/app -lll

      # Escaneo 2/3 - auditoria de dependencias del backend (politica en el run).
      - name: Backend dependency audit (pip-audit, blocks on fixable)
        run: |
          # Politica de bloqueo (D3): pip-audit falla ante vulnerabilidades
          # conocidas que tengan una correccion disponible. Los hallazgos
          # preexistentes se exceptuan de forma EXPLICITA por ID, con motivo
          # por linea, en scripts/security/pip_audit_exceptions.txt:
          # unicamente hallazgos SIN correccion publicada upstream; nunca un
          # continue-on-error global.
          EXC="scripts/security/pip_audit_exceptions.txt"
          IGNORE=$(grep -vE '^[[:space:]]*(#|$)' "$EXC" | awk '{print "--ignore-vuln "$1}')
          pip-audit -r App/Backend/requirements.txt --desc $IGNORE

      # Escaneo 3/3 - auditoria de dependencias del frontend. Politica de
      # bloqueo (D4/OQ1): NO bloqueante en esta iteracion (modo reporte). Se
      # corre con --audit-level=high y `|| true` para que los avisos de dev
      # transitivos (sin correccion simple) no rompan la CI; la justificacion
      # queda registrada en design.md (D4).
      - name: Frontend dependency audit (npm audit, report-only)
        working-directory: App/Frontend
        run: npm audit --audit-level=high || true

  # -----------------------------------------------------------------------
  # Job 5: corpus-ingest-tests — suites de los harnesses de ingesta (c-166)
  # -----------------------------------------------------------------------
  # Hasta c-166 las suites de scripts/corpus_ingest/ (test_*.py junto al codigo, sin
  # subcarpeta tests/) quedaban FUERA del gate: la CI solo corria el backend,
  # scripts/preflight y evaluation/. Corren 100% offline (sin red ni backend) con solo
  # las dependencias del harness mas pytest y PyYAML (lo importa
  # test_corpus_compose_isolation.py), con las mismas versiones/rangos que fija el repo
  # (pytest en App/Backend/requirements.txt, PyYAML en scripts/preflight/requirements.txt).
  # test_pseudonymize_corpus.py importa app.utils.pseudonymizer, que solo depende de la
  # biblioteca estandar y de app.constants: NO exige dependencias ni variables del
  # backend, asi que no se excluye (verificado en un entorno limpio con solo estas
  # dependencias). Si dejara de cumplirlo, se excluye con --ignore y se declara aca.
  corpus-ingest-tests:
    name: Corpus ingest tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/corpus_ingest/requirements.txt

      - name: Install corpus ingest dependencies
        run: pip install -r scripts/corpus_ingest/requirements.txt pytest==9.1.1 "PyYAML>=6.0,<7.0"

      - name: Run corpus ingest tests
        run: python -m pytest scripts/corpus_ingest -q
