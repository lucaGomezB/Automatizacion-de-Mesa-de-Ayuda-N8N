# ci.yml — GitHub Actions CI workflow (C-09, C-19)
# Tres jobs paralelos: backend-tests, frontend-tests y secret-scan.
# Triggers: push a main y pull_request.
# C-19: PostgreSQL service container + integration test step.
# secret-scan: gitleaks sobre el historial git + escaneo de la memoria de Engram.
# Sin secretos: toda la suite corre 100% offline (Gemini/N8N mockeados).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Backend — ruff lint + pytest (SQLite unit + PostgreSQL integration) + evaluation suite
  # -----------------------------------------------------------------------
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest

    # C-19: PostgreSQL 15.5 service container for integration tests.
    # Maps port 5432 inside the job; TEST_PG_URL points at it.
    services:
      postgres:
        image: postgres:15.5-alpine
        env:
          POSTGRES_USER: mesa
          POSTGRES_PASSWORD: mesa_ci_local
          POSTGRES_DB: mesa_de_ayuda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Settings (pydantic-settings) exige 4 campos sin default. Localmente
    # salen del .env (gitignorado); en CI se inyectan dummies validos. NO son
    # secretos: los tests mockean Gemini/N8N, el engine de la DATABASE_URL nunca
    # conecta (conftest inyecta SQLite in-memory) y las claves son de relleno.
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_dummy
      GEMINI_API_KEY: ci-dummy-key
      PSEUDONYMIZATION_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= # gitleaks:allow (dummy: base64url de 32 bytes '0')
      JWT_SECRET_KEY: ci-dummy-jwt-secret-key-for-testing-only # gitleaks:allow (dummy)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/Backend/requirements.txt

      - name: Install backend dependencies
        working-directory: App/Backend
        run: pip install -r requirements.txt

      - name: Install ruff (pinned, not in requirements.txt)
        run: pip install ruff==0.8.4

      - name: Lint backend with ruff
        working-directory: App/Backend
        run: ruff check .

      - name: Run backend unit tests (SQLite) with coverage
        working-directory: App/Backend
        run: |
          pytest -m "not integration" \
            --cov=app.routes \
            --cov=app.services \
            --cov=app.repositories \
            --cov-report=term-missing

      # C-19: PostgreSQL integration tests against the service container.
      # TEST_PG_URL overrides the default (localhost:5433) to use the
      # GitHub Actions service container on localhost:5432.
      - name: Run PostgreSQL integration tests
        working-directory: App/Backend
        env:
          TEST_PG_URL: postgresql+asyncpg://mesa:mesa_ci_local@localhost:5432/mesa_de_ayuda
        run: pytest -m integration -v

      # Verification de sincronia del OpenAPI estatico (C-10, D3):
      # regenera el esquema en memoria y lo compara contra docs/openapi.json.
      # Falla si el archivo commiteado no refleja el estado actual de la app.
      - name: Verify OpenAPI spec is in sync
        working-directory: App/Backend
        run: pytest tests/test_openapi_sync.py -v

      # C-41: cost readiness preflight. It is not part of App/Backend
      # requirements, so its own requirements file is installed first. The
      # suite covers guards present/absent; the CLI runs over the real
      # n8n/workflow.json and docker-compose.yml.
      - name: Install preflight dependencies
        run: pip install -r scripts/preflight/requirements.txt

      - name: Run cost preflight tests
        run: python -m pytest scripts/preflight -q

      - name: Run cost readiness preflight
        run: python scripts/preflight/cost_readiness.py

      # c-58: estatico, sin red ni clave; verifica modelo pineado + reintento acotado.
      - name: Run Gemini readiness preflight
        run: python scripts/preflight/gemini_readiness.py

      # Evaluation suite — self-contained (fixture JSON + FakeClassifier)
      # Chapter 7 thesis evidence; must not rot.
      - name: Install evaluation dependencies
        working-directory: evaluation
        run: pip install -r requirements.txt

      - name: Run evaluation tests
        working-directory: evaluation
        run: pytest

  # -----------------------------------------------------------------------
  # Job 2: App/Frontend — ESLint + Vitest con cobertura
  # -----------------------------------------------------------------------
  frontend-tests:
    name: App/Frontend tests (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: App/Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: App/Frontend
        run: npm ci

      - name: Lint frontend with ESLint
        working-directory: App/Frontend
        run: npm run lint

      - name: Run frontend tests with coverage
        working-directory: App/Frontend
        run: npm run test:coverage

  # -----------------------------------------------------------------------
  # Job 3: secret-scan — historial de git con gitleaks + memoria de Engram
  # -----------------------------------------------------------------------
  # Cubre dos frentes que el escaneo nativo de GitHub no ve:
  #   1. El historial COMPLETO de git con gitleaks (ruleset por defecto mas la
  #      allowlist minima de .gitleaks.toml). Requiere fetch-depth: 0.
  #   2. Los chunks .jsonl.gz de la memoria de Engram (.engram/), que GitHub no
  #      inspecciona, via scripts/security/scan_engram_secrets.py (gzip-aware).
  # No se usa gitleaks/gitleaks-action para evitar dependencias de licencia:
  # se descarga el .tar.gz del release fijado y se mueve a /usr/local/bin.
  secret-scan:
    name: Secret scan (gitleaks + Engram)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historial completo para gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version fijada: la misma verificada localmente (v8.30.1). El checksum
      # se valida para que el propio job de seguridad no confie ciegamente en
      # el binario descargado.
      - name: Install gitleaks (pinned v8.30.1)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets with gitleaks
        run: gitleaks git . --redact --config .gitleaks.toml --no-banner --exit-code 1

      - name: Scan Engram memory (.engram) for secrets
        run: python3 scripts/security/scan_engram_secrets.py .engram
